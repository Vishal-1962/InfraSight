spring.application.name=infrasight

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/infrasight_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Server Configuration
server.address=127.0.0.1
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
spring.mvc.problemdetails.enabled=false
server.servlet.session.cookie.http-only=true

# InfraSight Configuration
infrasight.retention-days=${RETENTION_DAYS:30}
infrasight.allow-private-targets=${ALLOW_PRIVATE_TARGETS:false}